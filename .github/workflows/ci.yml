name: CI

on:
  push:
    branches: [main]  # pull requests run through pull_request; avoids running every check twice
  pull_request:
  workflow_dispatch:

# a newer push to the same branch or PR supersedes the running checks
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# least privilege: CI only needs to read the repository
permissions:
  contents: read

jobs:
  python:
    name: python / ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30  # the suite takes 2-4 min; a hung async test must not hold a runner for 6 h
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test (synthetic fixtures only; the real dataset is never needed in CI)
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Shellcheck (installer, smoke tests)
        run: shellcheck deploy/oracle/*.sh scripts/*.sh

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build images (hash-locked dependencies, digest-pinned bases)
        run: |
          docker build --target runtime -t chainwatch:runtime .
          docker build --target demo -t chainwatch:demo .
      - name: Smoke test the public synthetic demo (read-only filesystem, 1 GB memory)
        run: |
          docker run -d --name cw --read-only --tmpfs /tmp --memory 1g -p 8000:8000 \
            -e CHAINWATCH_CONFIG=/app/configs/public-demo.yaml chainwatch:demo
          scripts/smoke_demo.sh http://localhost:8000   # same check as after a real deployment
      - name: Container logs
        if: always()
        run: docker logs cw || true

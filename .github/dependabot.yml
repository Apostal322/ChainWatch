# Dependency update automation. Updates arrive as pull requests and go through the full CI
# (tests, dependency audit, Docker smoke test); nothing is merged or published automatically.
# The hash locks (requirements/*.lock.txt) are regenerated with the commands in their
# headers; Dependabot keeps them hash-pinned when it bumps a version.
version: 2
updates:
  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # the serving image's ML stack must stay equal to the model registry's training
    # environment (requirements/serve.in): bumped deliberately, with a retrain
    ignore:
      - dependency-name: numpy
      - dependency-name: pandas
      - dependency-name: pyarrow
      - dependency-name: scikit-learn
      - dependency-name: xgboost
      - dependency-name: xgboost-cpu
      - dependency-name: joblib
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
